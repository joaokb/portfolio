name: Buscar trabalhos novos no Behance

on:
  schedule:
    - cron: '0 12 * * 1' # toda segunda, 9h em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/behance-novos.mjs
      - run: node scripts/medir-imagens.mjs
      - name: Salvar rascunhos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rascunhos de trabalhos novos do Behance"
          git push
