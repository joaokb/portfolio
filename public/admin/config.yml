# Painel de edição (Sveltia CMS). Entre em /admin com "Sign in with Token"
# usando um token do GitHub com acesso a este repositório.
backend:
  name: github
  repo: joaokb/portfolio
  branch: main
  commit_messages:
    create: 'Novo {{collection}}: {{slug}}'
    update: 'Atualiza {{collection}}: {{slug}}'
    delete: 'Remove {{collection}}: {{slug}}'
    uploadMedia: 'Envia imagem {{path}}'
    deleteMedia: 'Remove imagem {{path}}'

locale: pt
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projetos
    label: Projetos
    label_singular: Projeto
    folder: src/content/projetos
    create: true
    slug: '{{slug}}'
    sortable_fields: [order, title, year]
    summary: '{{order}}. {{title}} ({{client}}, {{year}})'
    fields:
      - { name: title, label: Título, widget: string }
      - { name: client, label: Cliente, widget: string }
      - { name: year, label: Ano, widget: number, value_type: int }
      - { name: discipline, label: Disciplina, widget: string, hint: 'Ex.: Campanha, Identidade visual, Rebranding' }
      - { name: role, label: Seu papel, widget: string, required: false, default: Direção de arte }
      - { name: context, label: Contexto, widget: string, required: false, hint: 'Ex.: Cria de Leão 2024, cliente de agência' }
      - { name: award, label: Prêmio, widget: string, required: false, hint: 'Aparece em azul no índice e na ficha' }
      - name: credits
        label: Créditos
        widget: list
        required: false
        fields:
          - { name: role, label: Função, widget: string }
          - { name: name, label: Nome, widget: string }
      - { name: order, label: Posição na lista, widget: number, value_type: int, hint: '1 aparece primeiro' }
      - { name: cover, label: Capa, widget: image, hint: 'Imagem de compartilhamento do case e prévia padrão do índice.' }
      - { name: logo, label: Logo da marca, widget: image, required: false, hint: 'SVG ou PNG transparente. Aparece em preto e branco ao lado do título e colorido ao passar o mouse.' }
      - { name: preview, label: Imagem do índice, widget: image, required: false, hint: 'Prévia grande ao passar o mouse (e miniatura quando não há logo). Vazio usa a capa.' }
      - name: images
        label: Imagens do case
        widget: list
        required: false
        field: { name: image, label: Imagem, widget: image }
        hint: 'Ordem de cima para baixo na página do projeto'
      - { name: video, label: Vídeo (link do Vimeo ou YouTube), widget: string, required: false }
      - { name: embed, label: Código de incorporação (iframe), widget: text, required: false, hint: 'Cole o <iframe> como veio (ex.: Juxtapose). Aparece depois das imagens.' }
      - { name: behance, label: Link do Behance, widget: string, required: false }
      - { name: pdf, label: PDF do projeto, widget: file, required: false }
      - { name: draft, label: Rascunho (esconder do site), widget: boolean, default: false, required: false }
      - name: en
        label: Versão em inglês
        widget: object
        required: false
        collapsed: true
        hint: 'Campo vazio mostra o português no /en/'
        fields:
          - { name: title, label: Título, widget: string, required: false }
          - { name: discipline, label: Disciplina, widget: string, required: false }
          - { name: context, label: Contexto, widget: string, required: false }
          - { name: award, label: Prêmio, widget: string, required: false }
          - { name: role, label: Papel, widget: string, required: false }
          - { name: body, label: Texto do case, widget: text, required: false, hint: 'Parágrafos separados por uma linha em branco' }
      - { name: body, label: Texto do case, widget: markdown, required: false, buttons: [bold, italic, link] }

  - name: bio
    label: Links da bio
    files:
      - name: links
        label: Página /links (Instagram)
        file: src/data/links.json
        fields:
          - name: links
            label: Links
            widget: list
            summary: '{{titulo}} ({{url}})'
            hint: 'A ordem aqui é a ordem na página. Desmarque "Ativo" para esconder sem apagar.'
            fields:
              - { name: id, label: 'Apelido (curto, sem espaço, ex.: behance)', widget: string, hint: 'Aparece no endereço /ir/apelido e na página de números. Não mude depois, senão a contagem recomeça.' }
              - { name: titulo, label: Texto do botão, widget: string }
              - { name: titulo_en, label: Texto do botão em inglês, widget: string, required: false }
              - { name: url, label: Endereço, widget: string }
              - { name: ativo, label: Ativo, widget: boolean, default: true }

  - name: site
    label: Sobre e contato
    files:
      - name: perfil
        label: Perfil
        file: src/data/perfil.json
        fields:
          - { name: nome, label: Nome, widget: string }
          - { name: cargo, label: Cargo, widget: string }
          - { name: cidade, label: Cidade, widget: string }
          - { name: bio, label: Apresentação, widget: text }
          - { name: foto, label: Foto (página Sobre), widget: image, required: false, hint: 'Vertical, 4:5. Aparece em preto e branco.' }
          - { name: sobre, label: Texto da página Sobre, widget: text, required: false, hint: 'Parágrafos separados por uma linha em branco. Vazio usa a Apresentação.' }
          - name: disponibilidade
            label: Disponibilidade (frase com o ponto azul)
            widget: select
            default: vaga
            options:
              - { label: 'Procurando vaga (pleno, in-house ou remoto)', value: vaga }
              - { label: 'Aceitando freelas', value: freela }
              - { label: 'Os dois', value: ambos }
          - name: destaque
            label: Cor de destaque
            widget: select
            default: caneta
            options:
              - { label: 'Azul caneta #1f2bd1', value: caneta }
              - { label: 'Vermelho revisão #c4161c', value: revisao }
              - { label: 'Laranja marcador #b23800', value: marcador }
              - { label: 'Verde prova #086b3c', value: prova }
              - { label: 'Magenta #b0127a', value: magenta }
          - { name: email, label: E-mail, widget: string }
          - name: links
            label: Links
            widget: list
            fields:
              - { name: nome, label: Nome, widget: string }
              - { name: url, label: URL, widget: string }
          - name: premios
            label: Prêmios
            widget: list
            summary: '{{ano}} {{nivel}}, {{festival}}'
            fields:
              - { name: ano, label: Ano, widget: number, value_type: int }
              - { name: nivel, label: Nível, widget: select, options: [Grand Prix, Ouro, Prata, Bronze, Shortlist, Finalista] }
              - { name: festival, label: Festival, widget: string }
              - { name: projeto, label: Projeto, widget: string, required: false }
              - { name: slug, label: Página do projeto, widget: relation, collection: projetos, value_field: '{{slug}}', search_fields: [title], display_fields: [title], required: false }
          - name: experiencia
            label: Experiência
            widget: list
            summary: '{{periodo}} {{empresa}}'
            fields:
              - { name: periodo, label: Período, widget: string }
              - { name: empresa, label: Empresa, widget: string }
              - { name: funcao, label: Função, widget: string }
          - name: formacao
            label: Formação
            widget: list
            fields:
              - { name: periodo, label: Período, widget: string }
              - { name: curso, label: Curso, widget: string }
              - { name: instituicao, label: Instituição, widget: string }
          - { name: ferramentas, label: Ferramentas, widget: string }
          - name: cursos
            label: Cursos
            widget: list
            summary: '{{ano}} {{curso}}'
            fields:
              - { name: ano, label: Ano, widget: number, value_type: int }
              - { name: curso, label: Curso, widget: string }
              - { name: instituicao, label: Instituição, widget: string }
          - name: habilidades
            label: Habilidades principais (barras)
            widget: list
            summary: '{{nome}} {{nivel}}%'
            fields:
              - { name: nome, label: Habilidade, widget: string }
              - { name: nivel, label: Nível (0 a 100), widget: number, value_type: int, min: 0, max: 100 }
          - name: en
            label: Versão em inglês
            widget: object
            collapsed: true
            fields:
              - { name: cargo, label: Cargo, widget: string }
              - { name: bio, label: Apresentação, widget: text }
              - { name: sobre, label: Texto da página Sobre, widget: text, required: false }
              - { name: termos, label: 'Traduções de termos (funções, cursos, habilidades)', widget: keyvalue, required: false }
          - { name: cv, label: Currículo em PDF, widget: file, required: false }
